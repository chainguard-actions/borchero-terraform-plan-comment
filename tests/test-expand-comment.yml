name: Test expand-comment with delete plan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake terraform binary and planfile with delete action
        run: |
          mkdir -p /tmp/tf-test
          echo "fake-planfile-content" > /tmp/tf-test/plan.tfplan

          mkdir -p /tmp/fake-bin

          cat > /tmp/fake-bin/terraform << 'EOF'
          #!/bin/sh
          case "$*" in
            *"-json"*)
              # Return a valid JSON planfile with a delete action
              printf '{"format_version":"1.0","resource_changes":[{"address":"aws_s3_bucket.old","change":{"actions":["delete"]}}]}\n'
              ;;
            *"-no-color"*)
              # Return a human-readable plan showing a resource being deleted
              printf "Terraform will perform the following actions:\n\n  # aws_s3_bucket.old will be destroyed\n  - resource \"aws_s3_bucket\" \"old\" {\n      - bucket = \"old-bucket\" -> null\n      - id     = \"old-bucket\" -> null\n    }\n\nPlan: 0 to add, 0 to change, 1 to destroy.\n"
              ;;
            *)
              echo "fake terraform: unknown command: $*" >&2
              exit 1
              ;;
          esac
          EOF
          chmod +x /tmp/fake-bin/terraform

          echo "PATH=/tmp/fake-bin:$PATH" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          planfile: /tmp/tf-test/plan.tfplan
          terraform-cmd: terraform
          working-directory: /tmp/tf-test
          header: "📝 Terraform Plan"
          skip-empty: "false"
          skip-comment: "true"
          expand-comment: "true"

      - name: Assert empty output is false
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected empty=false but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: empty=false as expected"

      - name: Assert markdown contains deleted resource
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty markdown output"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "aws_s3_bucket.old"; then
            echo "FAIL: expected markdown to contain deleted resource 'aws_s3_bucket.old'"
            exit 1
          fi
          echo "PASS: markdown contains expected deleted resource"
