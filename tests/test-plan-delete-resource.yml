name: Test plan with deleted resource and expand-comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock terraform binary with delete action
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/terraform" << 'EOF'
          #!/bin/sh
          # Mock terraform: returns a plan with one resource being deleted
          case "$*" in
            *"-json"*)
              cat << 'JSONEOF'
          {
            "format_version": "1.0",
            "resource_changes": [
              {
                "address": "aws_instance.old_server",
                "change": {
                  "actions": ["delete"]
                }
              }
            ]
          }
          JSONEOF
              ;;
            *"-no-color"*)
              cat << 'PLANEOF'
          Terraform will perform the following actions:

            # aws_instance.old_server will be destroyed
            - resource "aws_instance" "old_server" {
                - ami           = "ami-12345678" -> null
                - instance_type = "t2.micro" -> null
                - id            = "i-0abcdef1234567890" -> null
              }

          Plan: 0 to add, 0 to change, 1 to destroy.
          PLANEOF
              ;;
            *)
              echo "mock terraform: unknown command: $*" >&2
              exit 1
              ;;
          esac
          EOF
          chmod +x "$HOME/.local/bin/terraform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create dummy planfile
        run: |
          touch /tmp/tfplan.bin

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          planfile: /tmp/tfplan.bin
          terraform-cmd: terraform
          working-directory: .
          expand-comment: "true"
          skip-comment: "true"

      - name: Assert empty output is false
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected empty=false but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert markdown contains deleted resource name
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected markdown to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "aws_instance.old_server"; then
            echo "FAIL: expected markdown to contain 'aws_instance.old_server'"
            exit 1
          fi
          echo "PASS"
