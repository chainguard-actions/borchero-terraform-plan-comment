name: Test empty plan (no changes)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock terraform binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/terraform" << 'EOF'
          #!/bin/sh
          # Mock terraform: supports "show -json <planfile>" and "show -no-color <planfile>"
          case "$*" in
            *"-json"*)
              cat << 'JSONEOF'
          {
            "format_version": "1.0",
            "resource_changes": []
          }
          JSONEOF
              ;;
            *"-no-color"*)
              echo "No changes. Your infrastructure matches the configuration."
              ;;
            *)
              echo "mock terraform: unknown command: $*" >&2
              exit 1
              ;;
          esac
          EOF
          chmod +x "$HOME/.local/bin/terraform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create dummy planfile
        run: |
          touch /tmp/tfplan.bin

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          planfile: /tmp/tfplan.bin
          terraform-cmd: terraform
          working-directory: .
          skip-comment: "true"

      - name: Assert empty output is true
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected empty=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert markdown output is set
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected markdown to be non-empty"
            exit 1
          fi
          echo "PASS"
