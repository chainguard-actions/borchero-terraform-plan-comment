name: Test terraform plan with mixed resource changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake terraform with mixed changes
        run: |
          echo "fake-plan" > /tmp/tfplan

          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/terraform << 'EOF'
          #!/bin/sh
          if echo "$*" | grep -q -- '-json'; then
            # Return plan JSON with one create, one update, one delete
            cat << 'JSONEOF'
          {
            "format_version": "1.0",
            "resource_changes": [
              {
                "address": "null_resource.to_create",
                "change": {
                  "actions": ["create"]
                }
              },
              {
                "address": "null_resource.to_update",
                "change": {
                  "actions": ["update"]
                }
              },
              {
                "address": "null_resource.to_delete",
                "change": {
                  "actions": ["delete"]
                }
              }
            ]
          }
          JSONEOF
          else
            # Human-readable plan matching the resources above
            cat << 'HREOF'
          Terraform will perform the following actions:

            # null_resource.to_create will be created
            + resource "null_resource" "to_create" {
                + id = (known after apply)
              }

            # null_resource.to_update will be updated in-place
            ~ resource "null_resource" "to_update" {
                ~ triggers = {
                  ~ "key" = "old" -> "new"
                }
              }

            # null_resource.to_delete will be destroyed
            - resource "null_resource" "to_delete" {
                - id = "12345" -> null
              }

          Plan: 1 to add, 1 to change, 1 to destroy.
          HREOF
          fi
          EOF
          chmod +x /tmp/fake-bin/terraform
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          planfile: /tmp/tfplan
          terraform-cmd: terraform
          working-directory: /tmp
          skip-comment: "true"
          skip-empty: "false"

      - name: Assert empty output is false
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected empty=false but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert num-resources-created is 1
        env:
          ACTUAL: ${{ steps.action.outputs.num-resources-created }}
        run: |
          echo "actual num-resources-created: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected 1 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert num-resources-updated is 1
        env:
          ACTUAL: ${{ steps.action.outputs.num-resources-updated }}
        run: |
          echo "actual num-resources-updated: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected 1 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert num-resources-deleted is 1
        env:
          ACTUAL: ${{ steps.action.outputs.num-resources-deleted }}
        run: |
          echo "actual num-resources-deleted: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected 1 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert change-summary reflects all change types
        env:
          ACTUAL: ${{ steps.action.outputs.change-summary }}
        run: |
          echo "actual change-summary: $ACTUAL"
          FAIL=0
          echo "$ACTUAL" | grep -q "1 to create" || { echo "FAIL: missing '1 to create'"; FAIL=1; }
          echo "$ACTUAL" | grep -q "1 to update" || { echo "FAIL: missing '1 to update'"; FAIL=1; }
          echo "$ACTUAL" | grep -q "1 to delete" || { echo "FAIL: missing '1 to delete'"; FAIL=1; }
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "PASS"

      - name: Assert markdown contains all resource names
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          FAIL=0
          echo "$ACTUAL" | grep -q "null_resource.to_create" || { echo "FAIL: missing to_create"; FAIL=1; }
          echo "$ACTUAL" | grep -q "null_resource.to_update" || { echo "FAIL: missing to_update"; FAIL=1; }
          echo "$ACTUAL" | grep -q "null_resource.to_delete" || { echo "FAIL: missing to_delete"; FAIL=1; }
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "PASS"
