name: Test with terraform plan changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create planfile with changes
        run: |
          mkdir -p /tmp/tfplan-changes
          cat > /tmp/tfplan-changes/plan.txt << 'EOF'
          Terraform used the selected providers to generate the following execution plan.

          Terraform will perform the following actions:

            # aws_s3_bucket.example will be created
            + resource "aws_s3_bucket" "example" {
                + bucket = "my-example-bucket"
                + id     = (known after apply)
              }

          Plan: 1 to add, 0 to change, 0 to destroy.
          EOF

      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          planfile: /tmp/tfplan-changes/plan.txt
          skip-comment: "true"

      - name: Assert empty output is false
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected empty to be 'false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert markdown output is set
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected markdown output to be non-empty"
            exit 1
          fi
          echo "PASS"
