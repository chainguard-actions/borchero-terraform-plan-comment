name: Test plan with changes - skip-comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock terraform script (with changes)
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/terraform << 'EOF'
          #!/bin/bash
          echo "Terraform will perform the following actions:"
          echo ""
          echo "  # aws_instance.example will be created"
          echo "  + resource \"aws_instance\" \"example\" {"
          echo "      + ami           = \"ami-0c55b159cbfafe1f0\""
          echo "      + instance_type = \"t2.micro\""
          echo "    }"
          echo ""
          echo "Plan: 1 to add, 0 to change, 0 to destroy."
          EOF
          chmod +x /tmp/mock-bin/terraform
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - name: Create planfile
        run: |
          touch /tmp/test-changes.tfplan

      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          planfile: /tmp/test-changes.tfplan
          terraform-cmd: /tmp/mock-bin/terraform
          skip-comment: "true"

      - name: Assert empty output is false (changes exist)
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'empty' output to be 'false', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: empty output is 'false'"

      - name: Assert markdown output contains plan content
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected 'markdown' output to be non-empty"
            exit 1
          fi
          echo "PASS: markdown output is set"
