name: Test plan with changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create planfile from fixture
        run: |
          cp $GITHUB_WORKSPACE/actions/hardened/borchero--terraform-plan-comment/v3.0.0/tests/fixtures/plan-with-changes.tfplan /tmp/plan-changes.tfplan

      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          planfile: /tmp/plan-changes.tfplan
          skip-comment: "true"
          header: "📝 Test Plan"

      - name: Assert empty output is false (plan has changes)
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected empty=false for a plan with changes, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert markdown output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty markdown output for plan with changes"
            exit 1
          fi
          echo "PASS"
