name: Test Terraform plan with resource changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake terraform binary and planfile with changes
        run: |
          mkdir -p /tmp/tfplan
          echo "fake-plan-binary" > /tmp/tfplan/plan.tfplan

          # Create a fake terraform script that returns a plan with 1 create, 1 update, 1 delete
          cat > /tmp/fake-terraform.sh << 'SCRIPT'
          #!/bin/sh
          shift  # skip "show"
          if [ "$1" = "-json" ]; then
            cat << 'JSON'
          {
            "format_version": "1.2",
            "terraform_version": "1.6.0",
            "resource_changes": [
              {
                "address": "aws_instance.web",
                "change": {
                  "actions": ["create"],
                  "before": null,
                  "after": {"ami": "ami-12345", "instance_type": "t2.micro"}
                }
              },
              {
                "address": "aws_s3_bucket.data",
                "change": {
                  "actions": ["update"],
                  "before": {"tags": {}},
                  "after": {"tags": {"env": "prod"}}
                }
              },
              {
                "address": "aws_security_group.old",
                "change": {
                  "actions": ["delete"],
                  "before": {"name": "old-sg"},
                  "after": null
                }
              }
            ]
          }
          JSON
          elif [ "$1" = "-no-color" ]; then
            cat << 'PLAN'
          Terraform will perform the following actions:

            # aws_instance.web will be created
            + resource "aws_instance" "web" {
                + ami           = "ami-12345"
                + instance_type = "t2.micro"
              }

            # aws_s3_bucket.data will be updated in-place
            ~ resource "aws_s3_bucket" "data" {
                ~ tags = {
                    + "env" = "prod"
                  }
              }

            # aws_security_group.old will be destroyed
            - resource "aws_security_group" "old" {
                - name = "old-sg" -> null
              }

          Plan: 1 to add, 1 to change, 1 to destroy.
          PLAN
          fi
          SCRIPT
          chmod +x /tmp/fake-terraform.sh

          mkdir -p /tmp/fake-bin
          cp /tmp/fake-terraform.sh /tmp/fake-bin/terraform
          chmod +x /tmp/fake-bin/terraform

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          planfile: /tmp/tfplan/plan.tfplan
          terraform-cmd: /tmp/fake-bin/terraform
          working-directory: /tmp/tfplan
          skip-comment: "true"
        env:
          PATH: /tmp/fake-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      - name: Assert empty output is false
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected empty=false but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert num-resources-created is 1
        env:
          ACTUAL: ${{ steps.action.outputs.num-resources-created }}
        run: |
          echo "actual num-resources-created: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected num-resources-created=1 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert num-resources-updated is 1
        env:
          ACTUAL: ${{ steps.action.outputs.num-resources-updated }}
        run: |
          echo "actual num-resources-updated: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected num-resources-updated=1 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert num-resources-deleted is 1
        env:
          ACTUAL: ${{ steps.action.outputs.num-resources-deleted }}
        run: |
          echo "actual num-resources-deleted: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected num-resources-deleted=1 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert num-resources-recreated is 0
        env:
          ACTUAL: ${{ steps.action.outputs.num-resources-recreated }}
        run: |
          echo "actual num-resources-recreated: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected num-resources-recreated=0 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert change-summary contains correct counts
        env:
          ACTUAL: ${{ steps.action.outputs.change-summary }}
        run: |
          echo "actual change-summary: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "1 to create"; then
            echo "FAIL: expected '1 to create' in change-summary"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "1 to update"; then
            echo "FAIL: expected '1 to update' in change-summary"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "1 to delete"; then
            echo "FAIL: expected '1 to delete' in change-summary"
            exit 1
          fi
          echo "PASS"

      - name: Assert markdown contains resource names
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty markdown"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "aws_instance.web"; then
            echo "FAIL: expected 'aws_instance.web' in markdown"
            exit 1
          fi
          echo "PASS"
