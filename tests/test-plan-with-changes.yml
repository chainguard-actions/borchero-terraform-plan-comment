name: Test plan with resource changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock terraform script
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/terraform << 'EOF'
          #!/bin/bash
          # Mock terraform show
          if [[ "$1" == "show" && "$2" == "-json" ]]; then
            echo '{"format_version":"1.0","resource_changes":[{"address":"aws_s3_bucket.example","change":{"actions":["create"]}}]}'
          elif [[ "$1" == "show" && "$2" == "-no-color" ]]; then
            cat << 'PLAN'
          Terraform will perform the following actions:

            # aws_s3_bucket.example will be created
            + resource "aws_s3_bucket" "example" {
                + bucket = "my-bucket"
              }

          Plan: 1 to add, 0 to change, 0 to destroy.
          PLAN
          fi
          EOF
          chmod +x /tmp/mock-bin/terraform
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - name: Create dummy planfile
        run: touch /tmp/tfplan.bin

      - id: action
        uses: .
        with:
          token: fake-token-not-used
          planfile: /tmp/tfplan.bin
          terraform-cmd: terraform
          working-directory: /tmp
          skip-comment: "true"

      - name: Assert empty output is false
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected empty=false, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert markdown contains resource name
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected markdown output to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "aws_s3_bucket.example"; then
            echo "FAIL: expected markdown to contain resource name 'aws_s3_bucket.example'"
            exit 1
          fi
          echo "PASS"
