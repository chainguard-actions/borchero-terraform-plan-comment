name: Test plan with resource changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock terraform binary with resource changes
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/terraform" << 'EOF'
          #!/bin/sh
          # Mock terraform: returns a plan with one resource being created
          case "$*" in
            *"-json"*)
              cat << 'JSONEOF'
          {
            "format_version": "1.0",
            "resource_changes": [
              {
                "address": "aws_s3_bucket.example",
                "change": {
                  "actions": ["create"]
                }
              }
            ]
          }
          JSONEOF
              ;;
            *"-no-color"*)
              cat << 'PLANEOF'
          Terraform will perform the following actions:

            # aws_s3_bucket.example will be created
            + resource "aws_s3_bucket" "example" {
                + bucket = "my-test-bucket"
                + id     = (known after apply)
              }

          Plan: 1 to add, 0 to change, 0 to destroy.
          PLANEOF
              ;;
            *)
              echo "mock terraform: unknown command: $*" >&2
              exit 1
              ;;
          esac
          EOF
          chmod +x "$HOME/.local/bin/terraform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create dummy planfile
        run: |
          touch /tmp/tfplan.bin

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          planfile: /tmp/tfplan.bin
          terraform-cmd: terraform
          working-directory: .
          skip-comment: "true"

      - name: Assert empty output is false
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected empty=false but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert markdown contains resource name
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected markdown to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "aws_s3_bucket.example"; then
            echo "FAIL: expected markdown to contain 'aws_s3_bucket.example'"
            exit 1
          fi
          echo "PASS"
