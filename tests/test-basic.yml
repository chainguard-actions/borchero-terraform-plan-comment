name: Test basic usage with skip-comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create planfile
        run: |
          mkdir -p /tmp/tfplan
          echo "No changes. Your infrastructure matches the configuration." > /tmp/tfplan/plan.out

      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          planfile: /tmp/tfplan/plan.out
          skip-comment: "true"
          terraform-cmd: echo
          working-directory: "."

      - name: Assert empty output is set
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected 'empty' output to be set"
            exit 1
          fi
          echo "PASS: empty output is '$ACTUAL'"

      - name: Assert markdown output is set
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected 'markdown' output to be set"
            exit 1
          fi
          echo "PASS: markdown output is set"
