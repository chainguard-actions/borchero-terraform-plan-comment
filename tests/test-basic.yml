name: Test basic usage with skip-comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake planfile
        run: |
          mkdir -p /tmp/tfplan
          # Create a fake binary planfile (terraform plan output requires terraform show)
          # We'll create a text file and use a fake terraform-cmd that reads it
          echo "fake plan content" > /tmp/tfplan/plan.tfplan

      - name: Create fake terraform binary
        run: |
          mkdir -p /tmp/fake-tf-bin
          cat > /tmp/fake-tf-bin/terraform << 'EOF'
          #!/bin/bash
          # Fake terraform show that outputs a plan with no changes
          if [[ "$1" == "show" ]]; then
            echo "No changes. Your infrastructure matches the configuration."
            exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-tf-bin/terraform
          echo "/tmp/fake-tf-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          planfile: /tmp/tfplan/plan.tfplan
          terraform-cmd: terraform
          skip-comment: "true"
          pr-number: "1"

      - name: Assert empty output exists
        env:
          EMPTY: ${{ steps.action.outputs.empty }}
        run: |
          echo "empty: $EMPTY"
          if [ -z "$EMPTY" ]; then
            echo "FAIL: expected 'empty' output to be set"
            exit 1
          fi
          echo "PASS: empty output is set to '$EMPTY'"

      - name: Assert markdown output exists
        env:
          MARKDOWN: ${{ steps.action.outputs.markdown }}
        run: |
          echo "markdown length: ${#MARKDOWN}"
          echo "PASS: markdown output is present"
