name: Test basic usage with skip-comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake terraform planfile
        run: |
          # Create a minimal binary planfile that terraform show can read
          # We'll use a text file and override terraform-cmd to use cat
          mkdir -p /tmp/tfplan
          echo "No changes. Your infrastructure matches the configuration." > /tmp/tfplan/plan.txt

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          planfile: /tmp/tfplan/plan.txt
          terraform-cmd: cat
          working-directory: /tmp/tfplan
          header: "📝 Terraform Plan Test"
          skip-comment: "true"
          skip-empty: "false"
          expand-comment: "false"

      - name: Assert markdown output is set
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "markdown output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected markdown output to be non-empty"
            exit 1
          fi
          echo "PASS: markdown output is set"

      - name: Assert empty output is set
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "empty output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected empty output to be set (true or false)"
            exit 1
          fi
          echo "PASS: empty output is set to '$ACTUAL'"
