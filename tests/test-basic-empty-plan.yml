name: Test basic usage with empty plan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake terraform binary and planfile
        run: |
          # Create a fake planfile (the action passes this to terraform show)
          mkdir -p /tmp/tf-test
          echo "fake-planfile-content" > /tmp/tf-test/plan.tfplan

          # Create a fake terraform binary that handles "show" commands
          mkdir -p /tmp/fake-bin

          # For "terraform show -no-color <planfile>" → human-readable output (empty plan)
          # For "terraform show -json <planfile>" → JSON output with no resource_changes
          cat > /tmp/fake-bin/terraform << 'EOF'
          #!/bin/sh
          # Detect which form of "show" is being called
          case "$*" in
            *"-json"*)
              # Return a valid JSON planfile with no resource_changes (empty plan)
              echo '{"format_version":"1.0","resource_changes":[]}'
              ;;
            *"-no-color"*)
              # Return a human-readable plan with no changes
              echo "No changes. Your infrastructure matches the configuration."
              ;;
            *)
              echo "fake terraform: unknown command: $*" >&2
              exit 1
              ;;
          esac
          EOF
          chmod +x /tmp/fake-bin/terraform

          echo "PATH=/tmp/fake-bin:$PATH" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          planfile: /tmp/tf-test/plan.tfplan
          terraform-cmd: terraform
          working-directory: /tmp/tf-test
          header: "📝 Terraform Plan"
          skip-empty: "false"
          skip-comment: "true"
          expand-comment: "false"

      - name: Assert empty output is true
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected empty=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: empty=true as expected"

      - name: Assert markdown output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty markdown output"
            exit 1
          fi
          echo "PASS: markdown output is present"
