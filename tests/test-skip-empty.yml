name: Test skip-empty with no-changes plan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create planfile from fixture
        run: |
          cp $GITHUB_WORKSPACE/actions/hardened/borchero--terraform-plan-comment/v3.0.0/tests/fixtures/plan-no-changes.tfplan /tmp/plan-empty.tfplan

      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          planfile: /tmp/plan-empty.tfplan
          skip-empty: "true"
          skip-comment: "true"

      - name: Assert empty output is true
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected empty=true for a no-changes plan, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
