name: Test skip-empty with no changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create planfile with no changes
        run: |
          mkdir -p /tmp/tfplan
          echo "No changes. Your infrastructure matches the configuration." > /tmp/tfplan/plan.out

      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          planfile: /tmp/tfplan/plan.out
          skip-comment: "true"
          skip-empty: "true"
          terraform-cmd: echo
          working-directory: "."
          header: "📝 Terraform Plan Test"

      - name: Assert empty output is true
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'empty' output to be 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: empty output is 'true'"
