name: Test skip-empty with empty plan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake terraform and empty planfile
        run: |
          echo "fake-plan" > /tmp/tfplan

          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/terraform << 'EOF'
          #!/bin/sh
          if echo "$*" | grep -q -- '-json'; then
            cat << 'JSONEOF'
          {
            "format_version": "1.0",
            "resource_changes": []
          }
          JSONEOF
          else
            echo "No changes. Your infrastructure matches the configuration."
          fi
          EOF
          chmod +x /tmp/fake-bin/terraform
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          planfile: /tmp/tfplan
          terraform-cmd: terraform
          working-directory: /tmp
          skip-comment: "true"
          skip-empty: "true"

      - name: Assert empty output is true
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected empty=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert all resource counts are 0
        env:
          CREATED: ${{ steps.action.outputs.num-resources-created }}
          UPDATED: ${{ steps.action.outputs.num-resources-updated }}
          DELETED: ${{ steps.action.outputs.num-resources-deleted }}
          RECREATED: ${{ steps.action.outputs.num-resources-recreated }}
          EPHEMERAL: ${{ steps.action.outputs.num-resources-ephemeral }}
          IMPORTED: ${{ steps.action.outputs.num-resources-imported }}
        run: |
          echo "created: $CREATED, updated: $UPDATED, deleted: $DELETED"
          echo "recreated: $RECREATED, ephemeral: $EPHEMERAL, imported: $IMPORTED"
          FAIL=0
          [ "$CREATED" != "0" ] && echo "FAIL: created=$CREATED" && FAIL=1
          [ "$UPDATED" != "0" ] && echo "FAIL: updated=$UPDATED" && FAIL=1
          [ "$DELETED" != "0" ] && echo "FAIL: deleted=$DELETED" && FAIL=1
          [ "$RECREATED" != "0" ] && echo "FAIL: recreated=$RECREATED" && FAIL=1
          [ "$EPHEMERAL" != "0" ] && echo "FAIL: ephemeral=$EPHEMERAL" && FAIL=1
          [ "$IMPORTED" != "0" ] && echo "FAIL: imported=$IMPORTED" && FAIL=1
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "PASS: all resource counts are 0"
