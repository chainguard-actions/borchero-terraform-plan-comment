name: Test skip-empty with no-change plan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock terraform script for empty plan
        run: |
          # Create a mock terraform that outputs an empty plan (no changes)
          cat > /tmp/mock-terraform-empty << 'EOF'
          #!/bin/bash
          if [[ "$1" == "show" ]]; then
            cat << 'PLAN'
          No changes. Your infrastructure matches the configuration.

          Terraform has compared your real infrastructure against your configuration
          and found no differences, so no changes are needed.
          PLAN
          fi
          EOF
          chmod +x /tmp/mock-terraform-empty
          touch /tmp/empty-plan.tfplan

      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          planfile: /tmp/empty-plan.tfplan
          terraform-cmd: /tmp/mock-terraform-empty
          skip-comment: "true"
          skip-empty: "true"
          header: "📝 Terraform Plan (Empty)"

      - name: Assert empty output is true
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "empty: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'empty' output to be 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: plan is correctly identified as empty"

      - name: Assert num-resources-created is zero
        env:
          ACTUAL: ${{ steps.action.outputs.num-resources-created }}
        run: |
          echo "num-resources-created: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected num-resources-created to be '0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert num-resources-updated is zero
        env:
          ACTUAL: ${{ steps.action.outputs.num-resources-updated }}
        run: |
          echo "num-resources-updated: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected num-resources-updated to be '0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert num-resources-deleted is zero
        env:
          ACTUAL: ${{ steps.action.outputs.num-resources-deleted }}
        run: |
          echo "num-resources-deleted: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected num-resources-deleted to be '0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
