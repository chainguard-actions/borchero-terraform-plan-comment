name: Test skip-empty with no changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake planfile
        run: |
          mkdir -p /tmp/tfplan
          echo "fake plan content" > /tmp/tfplan/plan.tfplan

      - name: Create fake terraform binary that reports no changes
        run: |
          mkdir -p /tmp/fake-tf-bin
          cat > /tmp/fake-tf-bin/terraform << 'EOF'
          #!/bin/bash
          if [[ "$1" == "show" ]]; then
            echo "No changes. Your infrastructure matches the configuration."
            exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-tf-bin/terraform
          echo "/tmp/fake-tf-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          planfile: /tmp/tfplan/plan.tfplan
          terraform-cmd: terraform
          skip-empty: "true"
          skip-comment: "true"
          pr-number: "1"
          header: "📝 Terraform Plan (No Changes)"

      - name: Assert empty output is true
        env:
          EMPTY: ${{ steps.action.outputs.empty }}
        run: |
          echo "empty: $EMPTY"
          if [ "$EMPTY" != "true" ]; then
            echo "FAIL: expected empty=true when plan has no changes, got '$EMPTY'"
            exit 1
          fi
          echo "PASS: empty is true as expected"
