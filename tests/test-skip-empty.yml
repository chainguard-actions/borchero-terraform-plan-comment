name: Test skip-empty with no-change plan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake terraform planfile with no changes
        run: |
          mkdir -p /tmp/tfplan-empty
          echo "No changes. Your infrastructure matches the configuration." > /tmp/tfplan-empty/plan.txt

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          planfile: /tmp/tfplan-empty/plan.txt
          terraform-cmd: cat
          working-directory: /tmp/tfplan-empty
          header: "📝 Terraform Plan (skip-empty test)"
          skip-comment: "true"
          skip-empty: "true"
          expand-comment: "false"

      - name: Assert empty output reflects no changes
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "empty output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected empty output to be set"
            exit 1
          fi
          echo "PASS: empty output is '$ACTUAL'"

      - name: Assert markdown output is set
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "markdown output: $ACTUAL"
          echo "PASS: markdown output check complete"
