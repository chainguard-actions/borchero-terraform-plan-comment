name: Test skip-empty and custom header
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake terraform binary with empty plan
        run: |
          mkdir -p /tmp/tfplan
          echo "fake-plan-binary" > /tmp/tfplan/plan.tfplan

          cat > /tmp/fake-terraform.sh << 'SCRIPT'
          #!/bin/sh
          shift  # skip "show"
          if [ "$1" = "-json" ]; then
            cat << 'JSON'
          {
            "format_version": "1.2",
            "terraform_version": "1.6.0",
            "resource_changes": []
          }
          JSON
          elif [ "$1" = "-no-color" ]; then
            echo "No changes. Your infrastructure matches the configuration."
          fi
          SCRIPT
          chmod +x /tmp/fake-terraform.sh

          mkdir -p /tmp/fake-bin
          cp /tmp/fake-terraform.sh /tmp/fake-bin/terraform
          chmod +x /tmp/fake-bin/terraform

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          planfile: /tmp/tfplan/plan.tfplan
          terraform-cmd: /tmp/fake-bin/terraform
          working-directory: /tmp/tfplan
          header: "🔍 My Custom Plan Header"
          skip-empty: "true"
          skip-comment: "true"
        env:
          PATH: /tmp/fake-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      - name: Assert empty output is true
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected empty=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert markdown contains custom header
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty markdown"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "My Custom Plan Header"; then
            echo "FAIL: expected custom header in markdown"
            exit 1
          fi
          echo "PASS"

      - name: Assert all resource counts are 0
        env:
          CREATED: ${{ steps.action.outputs.num-resources-created }}
          UPDATED: ${{ steps.action.outputs.num-resources-updated }}
          DELETED: ${{ steps.action.outputs.num-resources-deleted }}
          RECREATED: ${{ steps.action.outputs.num-resources-recreated }}
          EPHEMERAL: ${{ steps.action.outputs.num-resources-ephemeral }}
          IMPORTED: ${{ steps.action.outputs.num-resources-imported }}
        run: |
          echo "created: $CREATED, updated: $UPDATED, deleted: $DELETED"
          echo "recreated: $RECREATED, ephemeral: $EPHEMERAL, imported: $IMPORTED"
          FAIL=0
          [ "$CREATED" != "0" ] && echo "FAIL: created=$CREATED" && FAIL=1
          [ "$UPDATED" != "0" ] && echo "FAIL: updated=$UPDATED" && FAIL=1
          [ "$DELETED" != "0" ] && echo "FAIL: deleted=$DELETED" && FAIL=1
          [ "$RECREATED" != "0" ] && echo "FAIL: recreated=$RECREATED" && FAIL=1
          [ "$EPHEMERAL" != "0" ] && echo "FAIL: ephemeral=$EPHEMERAL" && FAIL=1
          [ "$IMPORTED" != "0" ] && echo "FAIL: imported=$IMPORTED" && FAIL=1
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "PASS: all resource counts are 0"
