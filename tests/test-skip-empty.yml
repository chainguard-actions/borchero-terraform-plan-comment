name: Test skip-empty with empty plan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock terraform script
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/terraform << 'EOF'
          #!/bin/bash
          # Mock terraform show: output a valid JSON plan with no resource changes
          if [[ "$1" == "show" && "$2" == "-json" ]]; then
            echo '{"format_version":"1.0","resource_changes":[]}'
          elif [[ "$1" == "show" && "$2" == "-no-color" ]]; then
            echo "No changes. Your infrastructure matches the configuration."
          fi
          EOF
          chmod +x /tmp/mock-bin/terraform
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - name: Create dummy planfile
        run: touch /tmp/tfplan.bin

      - id: action
        uses: .
        with:
          token: fake-token-not-used
          planfile: /tmp/tfplan.bin
          terraform-cmd: terraform
          working-directory: /tmp
          header: "🔍 My Custom Header"
          skip-empty: "true"
          skip-comment: "true"

      - name: Assert empty output is true
        env:
          ACTUAL: ${{ steps.action.outputs.empty }}
        run: |
          echo "actual empty: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected empty=true, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert markdown contains custom header
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "My Custom Header"; then
            echo "FAIL: expected markdown to contain custom header 'My Custom Header'"
            exit 1
          fi
          echo "PASS"
